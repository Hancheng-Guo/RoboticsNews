name: Deploy RoboticsNews site
run-name: Deploy the current site from main

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'digests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site with archived issues
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp -a site/. "$RUNNER_TEMP/pages-site/"
          cp -a digests "$RUNNER_TEMP/pages-site/digests"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
